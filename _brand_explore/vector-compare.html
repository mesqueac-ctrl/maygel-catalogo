<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#eee8de;padding:40px;font-family:sans-serif;}
.row{display:flex;gap:20px;align-items:flex-end;margin-bottom:30px;}
.box{display:flex;flex-direction:column;align-items:center;gap:6px;}
.box img{background:#fff;border:1px solid #ccc;image-rendering:-webkit-optimize-contrast;}
</style></head>
<body>
<div class="row">
  <div class="box"><img src="favicon-vector.svg" width="16" height="16"/><span>vector 16px</span></div>
  <div class="box"><img src="favicon-vector.svg" width="32" height="32"/><span>vector 32px</span></div>
  <div class="box"><img src="favicon-vector.svg" width="48" height="48"/><span>vector 48px</span></div>
  <div class="box"><img src="favicon-vector.svg" width="180" height="180"/><span>vector 180px</span></div>
  <div class="box"><img src="favicon-vector.svg" width="512" height="512"/><span>vector 512px</span></div>
</div>
<div class="row">
  <div class="box"><img src="icon-16.png" width="16" height="16"/><span>raster 16px</span></div>
  <div class="box"><img src="icon-32.png" width="32" height="32"/><span>raster 32px</span></div>
  <div class="box"><img src="icon-48.png" width="48" height="48"/><span>raster 48px</span></div>
  <div class="box"><img src="icon-180.png" width="180" height="180"/><span>raster 180px</span></div>
  <div class="box"><img src="icon-512.png" width="512" height="512"/><span>raster 512px</span></div>
</div>
</body></html>
