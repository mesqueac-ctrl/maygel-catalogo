<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{width:1300px;background:#eee8de;padding:40px;font-family:sans-serif;}
.row{display:flex;gap:24px;margin-bottom:28px;align-items:flex-end;}
.card{background:#f7f2ea;border:1px solid #ddd;padding:24px;display:flex;align-items:center;justify-content:center;}
.card.dark{background:#1c130e;}
.cap{font-size:12px;color:#555;margin-top:6px;text-align:center;}
.col{display:flex;flex-direction:column;align-items:center;}
.box{display:flex;flex-direction:column;align-items:center;gap:5px;}
.box img{background:#fff;border:1px solid #ccc;}
</style></head>
<body>
<div class="row">
  <div class="col"><div class="card" style="width:480px;height:150px;"><img src="../public/brand/logo-horizontal-light.svg" width="380"/></div><div class="cap">logo horizontal claro</div></div>
  <div class="col"><div class="card dark" style="width:480px;height:150px;"><img src="../public/brand/logo-horizontal-dark.svg" width="380"/></div><div class="cap">logo horizontal oscuro</div></div>
  <div class="col"><div class="card" style="width:180px;height:180px;"><img src="../public/brand/monogram.svg" width="120"/></div><div class="cap">monograma</div></div>
</div>
<div class="row">
  <div class="box"><img src="../public/favicon.svg" width="16" height="16"/><span>favicon.svg 16</span></div>
  <div class="box"><img src="../public/favicon.svg" width="32" height="32"/><span>favicon.svg 32</span></div>
  <div class="box"><img src="../public/favicon.svg" width="48" height="48"/><span>favicon.svg 48</span></div>
  <div class="box"><img src="../public/favicon.svg" width="180" height="180"/><span>favicon.svg 180</span></div>
  <div class="box"><img src="../public/favicon.svg" width="512" height="512"/><span>favicon.svg 512</span></div>
</div>
<div class="row">
  <div class="box"><img src="favicon-ico-16.png" width="16" height="16"/><span>favicon.ico 16</span></div>
  <div class="box"><img src="favicon-ico-32.png" width="32" height="32"/><span>favicon.ico 32</span></div>
  <div class="box"><img src="favicon-ico-48.png" width="48" height="48"/><span>favicon.ico 48</span></div>
  <div class="box"><img src="../public/apple-touch-icon.png" width="180" height="180"/><span>apple-touch 180</span></div>
  <div class="box"><img src="../public/icon-192.png" width="192" height="192"/><span>icon-192</span></div>
  <div class="box"><img src="../public/icon-512.png" width="200" height="200"/><span>icon-512 (mostrado 200)</span></div>
</div>
</body></html>
